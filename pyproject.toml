[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mutual-fund-chatbot"
version = "1.0.0"
description = "A mutual fund FAQ chatbot with Google Gemini integration"
dependencies = [
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "lxml>=5.0.0",
    "openai==1.3.0",
    "python-dotenv==1.0.0",
    "flask==3.0.0",
    "flask-cors==4.0.0",
    "selenium==4.15.2",
    "webdriver-manager==4.0.1",
    "pytz==2023.3",
    "google-generativeai==0.8.3"
]

[project.scripts]
start = "app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
